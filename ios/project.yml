# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: LidarWalkthrough
options:
  bundleIdPrefix: com.coco3271
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LidarWalkthrough:
    type: application
    platform: iOS
    sources:
      - path: LidarWalkthrough
      # the AI kit (instructions, scripts, walkthrough viewer) ships inside the app and is
      # copied into every exported zip as _ai/
      - path: ../ai-kit
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco3271.lidarwalkthrough
        PRODUCT_NAME: LidarWalkthrough
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ABCDE12345   # or pick your team in Xcode › Signing & Capabilities
    scheme: {}
    info:
      path: LidarWalkthrough/Info.plist
      properties:
        CFBundleDisplayName: 3D LiDAR Scan
        NSCameraUsageDescription: The camera and LiDAR scanner measure each room and take the reference photos for your 3D walkthrough.
        NSLocationWhenInUseUsageDescription: Your location tags the property and each photo so the walkthrough knows where it was taken.
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
  # Logic tests (no LiDAR needed): compile the app's own sources that don't touch RoomPlan and
  # run in the iOS Simulator. CI passes a synthetic scan in with TEST_RUNNER_FIXTURE_BUNDLE.
  LidarWalkthroughTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LidarWalkthroughTests
      - path: LidarWalkthrough/Models.swift
      - path: LidarWalkthrough/PropertyStore.swift
      - path: LidarWalkthrough/FloorPlan.swift
      - path: LidarWalkthrough/MediaWriter.swift
      - path: LidarWalkthrough/MeshExporter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco3271.lidarwalkthrough.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  LidarWalkthroughTests:
    build:
      targets:
        LidarWalkthroughTests: [test]
    test:
      targets: [LidarWalkthroughTests]

